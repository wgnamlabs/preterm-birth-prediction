name: Lint & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install nbformat
        run: pip install nbformat

      - name: Validate notebooks are well-formed
        run: |
          python - << 'EOF'
          import glob
          import nbformat

          for path in glob.glob("notebooks/*.ipynb"):
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              print(f"OK: {path}")
          EOF
